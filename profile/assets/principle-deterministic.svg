<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="detPrinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA"/>
      <stop offset="100%" style="stop-color:#818CF8"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" fill="transparent"/>
  <!-- Outer ring -->
  <circle cx="60" cy="60" r="50" fill="none" stroke="url(#detPrinGrad)" stroke-width="2" stroke-dasharray="8,4" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate" from="0 60 60" to="360 60 60" dur="20s" repeatCount="indefinite"/>
  </circle>
  <!-- Inner gear shape using circles -->
  <circle cx="60" cy="60" r="30" fill="none" stroke="#60A5FA" stroke-width="2.5" opacity="0.8">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- Gear teeth -->
  <g opacity="0.7">
    <animateTransform attributeName="transform" type="rotate" from="0 60 60" to="-360 60 60" dur="12s" repeatCount="indefinite"/>
    <rect x="56" y="24" width="8" height="12" rx="2" fill="#60A5FA"/>
    <rect x="56" y="84" width="8" height="12" rx="2" fill="#60A5FA"/>
    <rect x="24" y="56" width="12" height="8" rx="2" fill="#60A5FA"/>
    <rect x="84" y="56" width="12" height="8" rx="2" fill="#60A5FA"/>
    <rect x="80" y="32" width="10" height="8" rx="2" fill="#60A5FA" transform="rotate(45 85 36)"/>
    <rect x="30" y="80" width="10" height="8" rx="2" fill="#60A5FA" transform="rotate(45 35 84)"/>
    <rect x="30" y="32" width="10" height="8" rx="2" fill="#60A5FA" transform="rotate(-45 35 36)"/>
    <rect x="80" y="80" width="10" height="8" rx="2" fill="#60A5FA" transform="rotate(-45 85 84)"/>
  </g>
  <!-- Center dot -->
  <circle cx="60" cy="60" r="5" fill="#60A5FA">
    <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <!-- 11/15 label -->
  <text x="60" y="63" text-anchor="middle" font-family="'SF Mono',monospace" font-size="7" font-weight="700" fill="#0D1117">11</text>
</svg>
