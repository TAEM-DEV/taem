<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="heroGradL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1">
        <animate attributeName="stop-color" values="#2563EB;#4F46E5;#7C3AED;#2563EB" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1">
        <animate attributeName="stop-color" values="#7C3AED;#2563EB;#4F46E5;#7C3AED" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  <rect width="800" height="200" fill="#FFFFFF" rx="12"/>
  <text x="400" y="95" text-anchor="middle" font-family="'SF Mono','Fira Code','JetBrains Mono',monospace" font-size="64" font-weight="800" fill="url(#heroGradL)" letter-spacing="16">TAEM</text>
  <text x="400" y="135" text-anchor="middle" font-family="'SF Mono','Fira Code','JetBrains Mono',monospace" font-size="14" fill="#57606A" letter-spacing="4">TERMINAL AREA ENERGY MANAGEMENT</text>
  <line x1="160" y1="160" x2="640" y2="160" stroke="#2563EB" stroke-width="1" opacity="0.2"/>
  <line x1="160" y1="160" x2="200" y2="160" stroke="url(#heroGradL)" stroke-width="2" opacity="0.6">
    <animate attributeName="x1" values="160;600;160" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="200;640;200" dur="4s" repeatCount="indefinite"/>
  </line>
</svg>
